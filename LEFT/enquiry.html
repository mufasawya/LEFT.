    <header>
        <nav>
             <a href="index.html">

        </nav>

    <main>

        <!--Enquiry form structure completed in HTML, styling and additional functionality will be added later.-->
        <section class="enquiry-intro">
            <h1>Make an Enquiry</h1>
            <p>Interested in a sneaker or need more information?
                Send us an enquiry and the LEFT team will get back to you.
            </p>
        </section>

        <form>
            <label for="full-name">Full Name:</label>
            <input type="text" name="full-name" id="full-name" placeholder="Enter full name...">
        

        
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="Enter email...">
        

        
            <label for="sneaker">Sneaker:</label>
            <select id="sneaker" name="sneaker">
                <option value="" disabled selected hidden>Select an option...</option>
                <option value="nike">Nike Air Force 1 '07 LV8</option>
                <option value="vans">Vans Knu Skool</option>
                <option value="dc">DC Court Graffik</option>
            </select>
        

        
            <label for="message">Message:</label>
            <textarea name="message" id="message" placeholder="Enter message..."></textarea>
            <input type="submit" value="Submit Enquiry">
        </form>
    </main>
