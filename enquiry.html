<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/enquiry.css">
</head>

<body>

    <header>
        <nav>
            <a href="index.html">
                <img src="images/LEFT logo..png" alt="LEFT logo">
            </a>
            <a href="products.html">Shop</a>
            <a href="about.html">About</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <!--Enquiry form structure completed in HTML, styling and additional functionality will be added later.-->
        <section class="enquiry-intro">
            <h1>Make an Enquiry</h1>
            <p>Interested in a sneaker or need more information?
                Send us an enquiry and the LEFT team will get back to you.
            </p>
        </section>

        <form>

            <div class="form-intro">
                <p>01 // YOUR ENQUIRY</p>
                <h2>LET'S FIND<br>YOUR PAIR.</h2>
            </div>

            <label for="full-name">Full Name:</label>
            <input type="text" name="full-name" id="full-name" placeholder="Enter full name...">



            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="Enter email...">



            <label for="sneaker">Sneaker:</label>
            <select id="sneaker" name="sneaker">
                <option value="" disabled selected hidden>Select an option...</option>

                <option value="nike-sb-dunk-low-cactus-jack">Nike SB Dunk Low Cactus Jack</option>
                <option value="nike-air-force-1-lv8">Nike Air Force 1 '07 LV8</option>
                <option value="bape-sta">BAPE STA</option>
                <option value="nike-dunk-low">Nike Dunk Low</option>
                <option value="dc-command">DC Command</option>
                <option value="vans-knu-skool">Vans Knu Skool</option>
                <option value="dc-court-graffik">DC Court Graffik</option>
                <option value="puma-suede-xl">PUMA Suede XL</option>
                <option value="puma-speedcat-og">PUMA Speedcat OG</option>
                <option value="nike-air-force-1-low-black">Nike Air Force 1 Low Black</option>
                <option value="adidas-samba">adidas Samba</option>
                <option value="adidas-campus">adidas Campus</option>
            </select>



            <label for="message">Message:</label>
            <textarea name="message" id="message" placeholder="Enter message..."></textarea>
            <input type="submit" value="Submit Enquiry">
        </form>
    </main>

    <footer>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Shop</a>
            <a href="about.html">About</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>

    </footer>

</body>

</html>
